[package]
name = "azenith-service"
version = "5.6.0"
edition = "2024"
description = "AZenith Core Daemon"
authors = ["Zexshia"]

[dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["poll", "fs", "time"] }
inotify = { version = "0.11", default-features = false }
signal-hook = "0.3"
glob = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[[bin]]
name = "azenith-service"
path = "src/main.rs"
