name: AZenith

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
      - "manager/**"
      - "archdaemon/**"
      - "binprofiles/**"
      - "binutils/**"
      - "binpreferenced/**"
      - "binder_resolver/**"
      - "sysdaemon/**"
      - "mainfiles/**"
      - "preloadbin/**"
      - "thermalcore/**"
      - "azenithApplist.json"
      - "version"
      - "version_type"
      - "compile_apk"

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  check-flag:
    name: Check compile_apk Flag
    runs-on: ubuntu-latest
    outputs:
      compile_apk: ${{ steps.flag.outputs.compile_apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            compile_apk
          sparse-checkout-cone-mode: false

      - name: Read compile_apk Flag
        id: flag
        run: |
          if [ -f compile_apk ]; then
            VAL=$(tr -d '\n\r ' < compile_apk | tr '[:upper:]' '[:lower:]')
          else
            VAL="false"
          fi
          if [ "$VAL" = "true" ]; then
            echo "compile_apk=true" >> "$GITHUB_OUTPUT"
            echo "compile_apk=true -> skipping full build workflow (handled by Test Build APK)"
          else
            echo "compile_apk=false" >> "$GITHUB_OUTPUT"
            echo "compile_apk=false -> running full build workflow"
          fi

  build-binder-resolver:
    name: Build Binder Resolver APK
    needs: [check-flag]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle (binder_resolver)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-binder-resolver-${{ hashFiles('binder_resolver/**/*.gradle*', 'binder_resolver/gradle/libs.versions.toml', 'binder_resolver/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-binder-resolver-

      - name: Build Binder Resolver APK
        working-directory: ./binder_resolver
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Stage Binder Resolver APK
        run: |
          APK=$(find binder_resolver/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "binder_resolver APK not found" >&2
            exit 1
          fi
          cp "$APK" sysdaemon/binder_resolver.apk
          ls -l sysdaemon/binder_resolver.apk

      - name: Upload Binder Resolver APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binder-resolver-apk
          path: sysdaemon/binder_resolver.apk
          retention-days: 1
          if-no-files-found: error

  build-preloadbin:
    name: Build Preload Binary
    needs: [check-flag]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          echo "Build mode set to: $V_TYPE"

      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r30

      - name: Compile Preload Binary
        working-directory: ./preloadbin
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Upload Preload Binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preloadbin-libs
          path: preloadbin/libs
          retention-days: 1
          if-no-files-found: error

  build-rust:
    name: Build ${{ matrix.name }}
    needs: [check-flag]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Daemon
            dir: archdaemon
            bin: azenith-service
          - name: AZenith Thermalcore
            dir: thermalcore
            bin: rianixia-thermalcore
          - name: AZenith Profilesettings
            dir: binprofiles
            bin: azenith-profilesettings
          - name: AZenith Utility
            dir: binutils
            bin: azenith-utilityconf
          - name: AZenith Preferenced
            dir: binpreferenced
            bin: azenith-preferencedtweaks
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify Module
        run: bash .github/scripts/verify.sh

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          if [ "$V_TYPE" == "experimental" ]; then
            echo "RUST_PROFILE=debug" >> $GITHUB_ENV
          else
            echo "RUST_PROFILE=release" >> $GITHUB_ENV
          fi
          echo "Build mode set to: $V_TYPE"

      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r30

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Cargo (${{ matrix.dir }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            ${{ matrix.dir }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.dir }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir), format('{0}/Cargo.toml', matrix.dir)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.dir }}-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

      - name: Compile ${{ matrix.name }}
        working-directory: ./${{ matrix.dir }}
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi

      - name: Upload ${{ matrix.name }} Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-${{ matrix.dir }}
          path: |
            ${{ matrix.dir }}/target/aarch64-linux-android/${{ env.RUST_PROFILE }}/${{ matrix.bin }}
            ${{ matrix.dir }}/target/armv7-linux-androideabi/${{ env.RUST_PROFILE }}/${{ matrix.bin }}
          retention-days: 1
          if-no-files-found: error

  build-sysdaemon:
    name: Build AZenith Binder Monitor
    needs: [check-flag, build-binder-resolver]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify Module
        run: bash .github/scripts/verify.sh

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          if [ "$V_TYPE" == "experimental" ]; then
            echo "RUST_PROFILE=debug" >> $GITHUB_ENV
          else
            echo "RUST_PROFILE=release" >> $GITHUB_ENV
          fi
          echo "Build mode set to: $V_TYPE"

      - name: Download Binder Resolver APK
        uses: actions/download-artifact@v4
        with:
          name: binder-resolver-apk
          path: sysdaemon

      - name: Verify Staged Binder Resolver APK
        run: ls -l sysdaemon/binder_resolver.apk

      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r30

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Cargo (sysdaemon)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            sysdaemon/target
          key: ${{ runner.os }}-cargo-sysdaemon-${{ hashFiles('sysdaemon/Cargo.lock', 'sysdaemon/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sysdaemon-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk
          fi

      - name: Compile AZenith Binder Monitor
        working-directory: ./sysdaemon
        run: |
          if [ "$V_TYPE" == "experimental" ]; then
            cargo ndk -t arm64-v8a -t armeabi-v7a build
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a build --release
          fi

      - name: Upload AZenith Binder Monitor Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-sysdaemon
          path: |
            sysdaemon/target/aarch64-linux-android/${{ env.RUST_PROFILE }}/azenith-appmonitoring
            sysdaemon/target/armv7-linux-androideabi/${{ env.RUST_PROFILE }}/azenith-appmonitoring
          retention-days: 1
          if-no-files-found: error

  build-manager:
    name: Build Manager APK
    needs: [check-flag]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify Module
        run: bash .github/scripts/verify.sh

      - name: Copy changelog file
        run: bash .github/scripts/changelog.sh

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          echo "Build mode set to: $V_TYPE"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle (manager)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-manager-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/libs.versions.toml', 'manager/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-manager-

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > manager/app/azenith.jks

      - name: Build Manager APK
        working-directory: ./manager
        run: |
          chmod +x ./gradlew
          if [ "$V_TYPE" == "experimental" ]; then
            ./gradlew clean assembleDebug
          else
            ./gradlew clean assembleRelease
          fi
        env:
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: Rename Manager APK
        run: |
          APK_PATH=$(find manager/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Manager APK not found!" >&2
            exit 1
          fi
          VERSION=$(tr -d '\n\r ' < version)
          VERSION_TYPE=$(tr -d '\n\r ' < version_type)
          VERSION_CODE=$(git rev-list HEAD --count)
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_DIR=$(dirname "$APK_PATH")
          RENAMED_APK="${APK_DIR}/AZenith-${VERSION}-${VERSION_CODE}-${SHORT_SHA}-${VERSION_TYPE}.apk"
          mv "$APK_PATH" "$RENAMED_APK"
          ls -lh "$RENAMED_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azenith-apk
          path: manager/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Report APK Size
        run: |
          python3 - <<'EOF'
          import zipfile, os, glob, collections
          apk = glob.glob('manager/app/build/outputs/apk/**/*.apk', recursive=True)[0]
          z = zipfile.ZipFile(apk)
          print(f'APK_REPORT file={os.path.basename(apk)} apk_bytes={os.path.getsize(apk)}')
          cat = collections.defaultdict(lambda: [0, 0])
          for i in z.infolist():
              n = i.filename
              if n.endswith('.dex'): k = 'dex'
              elif n.startswith('lib/'): k = 'lib'
              elif n.startswith('assets/'): k = 'assets'
              elif n == 'resources.arsc': k = 'arsc'
              elif n.startswith('res/'): k = 'res'
              elif n.startswith('META-INF/'): k = 'meta'
              else: k = 'other'
              cat[k][0] += i.compress_size
              cat[k][1] += i.file_size
          for k in ['dex', 'lib', 'assets', 'arsc', 'res', 'meta', 'other']:
              print(f'APK_REPORT {k} packed={cat[k][0]} stored={cat[k][1]}')
          for i in sorted(z.infolist(), key=lambda x: -x.compress_size)[:30]:
              print(f'APK_REPORT entry packed={i.compress_size} stored={i.file_size} {i.filename}')
          EOF

  package:
    name: Package Flashable Zip
    needs: [check-flag, build-preloadbin, build-rust, build-sysdaemon, build-manager]
    if: needs.check-flag.outputs.compile_apk != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine Build Type
        id: build_type
        run: |
          V_TYPE=$(cat version_type | tr -d '\n\r ')
          echo "V_TYPE=$V_TYPE" >> $GITHUB_ENV
          if [ "$V_TYPE" == "experimental" ]; then
            echo "APK_SUBDIR=debug" >> $GITHUB_ENV
          else
            echo "APK_SUBDIR=release" >> $GITHUB_ENV
          fi
          echo "Build mode set to: $V_TYPE"

      - name: Download Preload Binary
        uses: actions/download-artifact@v4
        with:
          name: preloadbin-libs
          path: preloadbin/libs

      - name: Download Daemon
        uses: actions/download-artifact@v4
        with:
          name: rust-archdaemon
          path: archdaemon/target

      - name: Download Thermalcore
        uses: actions/download-artifact@v4
        with:
          name: rust-thermalcore
          path: thermalcore/target

      - name: Download Profilesettings
        uses: actions/download-artifact@v4
        with:
          name: rust-binprofiles
          path: binprofiles/target

      - name: Download Utility
        uses: actions/download-artifact@v4
        with:
          name: rust-binutils
          path: binutils/target

      - name: Download Preferenced
        uses: actions/download-artifact@v4
        with:
          name: rust-binpreferenced
          path: binpreferenced/target

      - name: Download Binder Monitor
        uses: actions/download-artifact@v4
        with:
          name: rust-sysdaemon
          path: sysdaemon/target

      - name: Download Manager APK
        uses: actions/download-artifact@v4
        with:
          name: azenith-apk
          path: manager/app/build/outputs/apk/${{ env.APK_SUBDIR }}

      - name: Restore Executable Permissions
        run: |
          find preloadbin/libs -type f -exec chmod +x {} +
          find archdaemon/target thermalcore/target binprofiles/target binutils/target binpreferenced/target sysdaemon/target -type f -exec chmod +x {} +

      - name: Compile Flashable Zip
        id: compileZip
        run: bash .github/scripts/compile_zip.sh

      - name: Upload To Telegram
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: AZenith
        run: |
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            export VERSION=$(git rev-list --count HEAD)
            bash .github/scripts/telebot.sh "${{ steps.compileZip.outputs.zipName }}"
          else
            echo "Telegram bot token or chatid is undefined!"
            exit 1
          fi
