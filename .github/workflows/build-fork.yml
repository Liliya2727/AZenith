name: AZenith Fork Build & Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build-fork.yml"
      - ".github/scripts/**"
      - "manager/**"
      - "archdaemon/**"
      - "binprofiles/**"
      - "binutils/**"
      - "binpreferenced/**"
      - "binder_resolver/**"
      - "sysdaemon/**"
      - "mainfiles/**"
      - "preloadbin/**"
      - "thermalcore/**"
      - "azenithApplist.json"
      - "version"
      - "version_type"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Опубликовать GitHub Release?"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AZenith Components & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Verify module and inject version
        run: bash .github/scripts/verify.sh

      - name: Copy changelog
        run: bash .github/scripts/changelog.sh

      - name: Determine build type
        run: |
          V_TYPE=$(tr -d '\n\r ' < version_type)
          echo "V_TYPE=$V_TYPE" >> "$GITHUB_ENV"
          echo "Build mode set to: $V_TYPE"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r30

      - name: Build Binder Resolver APK
        working-directory: ./binder_resolver
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Stage Binder Resolver APK
        run: |
          APK=$(find binder_resolver/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Binder Resolver APK not found" >&2
            exit 1
          fi
          cp "$APK" sysdaemon/binder_resolver.apk

      - name: Compile native daemon
        working-directory: ./archdaemon
        run: |
          if [ "$V_TYPE" = "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Compile preload binary
        working-directory: ./preloadbin
        run: |
          if [ "$V_TYPE" = "experimental" ]; then
            ndk-build NDK_DEBUG=1
          else
            ndk-build
          fi

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust module binaries
        run: |
          set -e
          for project in thermalcore binprofiles binutils binpreferenced sysdaemon; do
            echo "Building $project"
            cd "$GITHUB_WORKSPACE/$project"
            if [ "$V_TYPE" = "experimental" ]; then
              cargo ndk -t arm64-v8a -t armeabi-v7a build
            else
              cargo ndk -t arm64-v8a -t armeabi-v7a build --release
            fi
          done

      - name: Build debug APK
        working-directory: ./manager
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Package module ZIP
        id: package_module
        run: |
          bash .github/scripts/compile_zip.sh
          # Находим созданный архив для удобной привязки к релизу
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azenith-debug-apk
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload module ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: azenith-module-zip
          path: "*.zip"
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            manager/app/build/outputs/apk/debug/*.apk
            ${{ steps.package_module.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
