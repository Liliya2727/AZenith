name: Test Build APK

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify Module
        run: bash .github/scripts/verify.sh

      - name: Copy changelog file
        run: bash .github/scripts/changelog.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle (test-build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-test-build-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/libs.versions.toml', 'manager/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-build-

      - name: Decode Keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Error: KEYSTORE secret is missing or empty." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > manager/app/azenith.jks
          if [ ! -s manager/app/azenith.jks ]; then
            echo "Error: decoded keystore file is empty." >&2
            exit 1
          fi

      - name: Build Signed Release APK
        working-directory: ./manager
        env:
          KS_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KS_PWD" ] || [ -z "$KS_ALIAS" ]; then
            echo "Error: KEYSTORE_PASSWORD or KEYSTORE_ALIAS secret is missing." >&2
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew clean assembleRelease

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f manager/app/azenith.jks

      - name: Locate and Verify Signed APK
        run: |
          APK_PATH=$(find manager/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found!" >&2
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azenith-test-apk
          path: manager/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Error: BOT_TOKEN or CHAT_ID secret is not set." >&2
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_SIZE=$(stat -c%s "$APK_PATH")
          MAX_BYTES=$((50 * 1024 * 1024))
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE / 1048576}")

          CAPTION=$(printf 'AZenith Test Build\nBranch: %s\nCommit: %s\nRun: %s' "$BRANCH_NAME" "$SHORT_SHA" "$RUN_URL")

          if [ "$APK_SIZE" -gt "$MAX_BYTES" ]; then
            echo "APK size (${SIZE_MB} MB) exceeds Telegram 50 MB limit; sending text notification only."
            TEXT=$(printf 'AZenith Test Build\nBranch: %s\nCommit: %s\nAPK size: %s MB (> 50 MB Telegram limit, download from workflow artifacts)\nRun: %s' "$BRANCH_NAME" "$SHORT_SHA" "$SIZE_MB" "$RUN_URL")
            RESP=$(printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$BOT_TOKEN" | \
              curl -sS --config - \
                --form-string "chat_id=${CHAT_ID}" \
                --form-string "text=${TEXT}" \
                --form-string "disable_web_page_preview=true")
          else
            echo "Uploading APK (${SIZE_MB} MB) to Telegram..."
            RESP=$(printf 'url = "https://api.telegram.org/bot%s/sendDocument"\n' "$BOT_TOKEN" | \
              curl -sS --config - \
                --form-string "chat_id=${CHAT_ID}" \
                -F "document=@${APK_PATH}" \
                --form-string "caption=${CAPTION}")
          fi

          if ! printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "Telegram API request failed." >&2
            printf '%s\n' "$RESP" | sed -E 's/bot[0-9]+:[A-Za-z0-9_-]+/bot***REDACTED***/g' >&2
            exit 1
          fi
          echo "Telegram notification sent successfully."
