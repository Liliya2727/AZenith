[package]
name = "rynx-thermalcore"
version = "2.0.0"
edition = "2024"
authors = ["rianixia"]

[dependencies]
nix = { version = "0.31", features = ["poll", "time"] }
inotify = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
signal-hook = "0.4"
serde_json = { version = "1.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
simulator = ["dep:serde_json"]
collector = ["dep:serde_json"]

[[bin]]
name = "rianixia-thermalcore"
path = "src/main.rs"

[[bin]]
name = "thermal-collector"
path = "src/bin/thermal-collector.rs"
required-features = ["collector"]

